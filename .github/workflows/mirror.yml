name: Mirror upstream devkits

# Copies upstream Zig's devkits from https://ziglang.org/deps/, unchanged, into
# the immutable release `upstream-<version>`, then points their hosts in
# devkits.json at it. That site has no index: the hosts and the version come
# from upstream Zig's own CI scripts (ci/*.sh, ci/*.ps1) at `zig_ref`, which
# download exactly these files. Nightly it checks upstream master; a version
# already mirrored is skipped. The release is filled as a draft, one devkit at
# a time (the runner's disk holds one), and published once complete.

on:
  # a push that changes only files of no-ci.txt passes without mirroring
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'   # nightly, 05:00 UTC
  workflow_dispatch:
    inputs:
      zig_ref:
        description: Upstream Zig (codeberg.org/ziglang/zig) branch, tag or commit whose CI scripts name the devkits
        default: master

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      ci: ${{ steps.changes.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Anything outside no-ci.txt changed?
        id: changes
        run: bash .github/scripts/changes.sh "${{ github.event_name }}" "${{ github.event.before }}" "${{ github.sha }}" | tee -a "$GITHUB_OUTPUT"

  mirror:
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ZIG_REF: ${{ inputs.zig_ref || 'master' }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the devkits upstream CI uses
        id: list
        run: |
          api=https://codeberg.org/api/v1/repos/ziglang/zig
          sha=$(curl -fsSL --retry 5 --retry-delay 15 "$api/commits?sha=$ZIG_REF&limit=1" | jq -r '.[0].sha')
          echo "upstream zig at $sha"
          : > devkits.txt
          for url in $(curl -fsSL --retry 5 --retry-delay 15 "$api/contents/ci?ref=$sha" | jq -r '.[] | select(.name | test("\\.(sh|ps1)$")) | .download_url'); do
            script=$(curl -fsSL --retry 5 --retry-delay 15 "$url")
            target=$(grep -m1 -o -E '^\$?TARGET ?= ?"[^"]+"' <<< "$script" | sed -E 's/.*"([^"]+)"/\1/') || continue
            version=$(grep -m1 -o -E 'zig\+llvm\+lld\+clang-\$TARGET-[^"]+' <<< "$script" | sed 's/.*\$TARGET-//') || continue
            echo "$target $version" >> devkits.txt
          done
          sort -u -o devkits.txt devkits.txt
          cat devkits.txt
          versions=$(cut -d' ' -f2 devkits.txt | sort -u)
          if [ -z "$versions" ] || [ "$(wc -l <<< "$versions")" != 1 ]; then
            echo "::error::expected one devkit version in upstream CI, found: $versions"
            exit 1
          fi
          tag="upstream-$versions"
          echo "version=$versions" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>&1)" = false ]; then
            echo "::notice::$tag is already published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror them into a draft, then publish
        if: steps.list.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.list.outputs.version }}
          SHA: ${{ steps.list.outputs.sha }}
          TAG: ${{ steps.list.outputs.tag }}
        run: |
          # a draft left by a failed run starts over
          gh release delete "$TAG" --yes 2>&1 || true
          gh release create "$TAG" --draft --title "Upstream devkits $VERSION" --notes \
            "Upstream Zig's devkits for \`$VERSION\`, mirrored unchanged from https://ziglang.org/deps/: the hosts upstream Zig's CI used at \`$SHA\`. \`devkits.json\` on main says which devkit each host should use."
          : > SHA256SUMS
          echo '{}' > entries.json
          while read -r target version; do
            ext=tar.xz
            case "$target" in *-windows-*) ext=zip ;; esac
            name="zig+llvm+lld+clang-$target-$version.$ext"
            curl -fsSL --retry 5 --retry-delay 15 -o "$name" "https://ziglang.org/deps/$name"
            sum=$(sha256sum "$name" | cut -d' ' -f1)
            echo "$sum  $name" >> SHA256SUMS
            gh release upload "$TAG" "$name"
            rm "$name"
            jq --arg t "$target" --arg v "$version" --arg tag "$TAG" --arg a "$name" --arg s "$sum" --arg repo "$GH_REPO" \
              '.[$t] = {version: $v, source: "upstream", release: $tag, asset: $a, sha256: $s,
                        url: "https://github.com/\($repo)/releases/download/\($tag | @uri)/\($a | @uri)"}' \
              entries.json > entries.tmp && mv entries.tmp entries.json
          done < devkits.txt
          gh release upload "$TAG" SHA256SUMS
          gh release edit "$TAG" --draft=false --latest=false
          cat entries.json

      - name: Point devkits.json at them
        if: steps.list.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.list.outputs.version }}
        run: |
          bash .github/scripts/update-manifest.sh "devkits.json: upstream $VERSION" < entries.json
