name: Build devkits

# Builds the devkit for a host upstream Zig publishes none for ($TARGET):
# cross-compiled LLVM, Clang and LLD and a cross-compiled Zig, made by the
# scripts in zig-build (https://github.com/randyos-org/zig-build), assembled
# in upstream's devkit layout, smoke-tested on the host's own runner, and
# published as its own immutable release.
#
# All build logic lives in zig-build; this workflow only schedules it, carries
# results between jobs, packages and publishes. Modeled on
# randyos-org/powerzig-bootstrap (the cross LLVM) and randyos-org/zig-toolchain
# (testing a cross-built host on its own runner). A run builds only if no
# release holds a manifest with the same zig_key (cross-manifest.sh: the LLVM
# inputs, the zig-src pin, the target and the scripts).
#
# The devkit's Zig is zig-src at zig-build's pin (stage3's version), so it is
# rebuilt whenever that pin moves.
#
# Jobs:
#   changes  skip everything for a push that changes only files of no-ci.txt
#   prepare  resolve the zig-build commit, compute keys, skip if already released
#   host     stage3 zig for the runner (cached by host_key); its version names the release
#   llvm-1   cross LLVM; stops itself before the 6h job limit, saving ccache
#   llvm-2   resumes from llvm-1's ccache if llvm-1 did not finish
#   zig      cross Zig against that LLVM, assembled with it into the devkit
#   smoke    the devkit on the host's own runner
#   publish  the devkit, its manifest and SHA256SUMS as the immutable release
#            <target>-<zig version>, then devkits.json on main points at it

on:
  # a push that changes only files of no-ci.txt passes without building
  push:
    branches: [main]
  # zig-build's own pushes cannot trigger this repo: check nightly for a
  # changed zig_key (an unchanged one stops at prepare)
  schedule:
    - cron: '0 6 * * *'   # nightly, 06:00 UTC
  workflow_dispatch:
    inputs:
      zig_build_ref:
        description: zig-build branch, tag or commit to build from
        type: string
        default: main
      force:
        description: Build and publish even if a release holds this zig_key
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  ZIG_BUILD_URL: https://github.com/randyos-org/zig-build.git
  # zig-build's ci-sources.sh fetches zig-src (and upstream's release tags) from
  # here: the GitHub mirror of https://codeberg.org/emanspeaks/zig
  ZIG_SRC_URL: https://github.com/randyos-org/zig.git
  # also spelled out in the zig, smoke and publish jobs' DEVKIT, since a job's
  # env cannot read this one
  TARGET: x86_64-macos-none
  CPU: baseline
  # anything built here moves between runners, so it must run on any x86_64 cpu
  ZIG_HOST_CPU: baseline
  STAGE3_TESTS: 0
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: true
  CCACHE_MAXSIZE: 6G
  CCACHE_COMPRESS: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      ci: ${{ steps.changes.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Anything outside no-ci.txt changed?
        id: changes
        run: bash .github/scripts/changes.sh "${{ github.event_name }}" "${{ github.event.before }}" "${{ github.sha }}" | tee -a "$GITHUB_OUTPUT"

  prepare:
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    outputs:
      zig_build_commit: ${{ steps.keys.outputs.zig_build_commit }}
      host_key: ${{ steps.keys.outputs.host_key }}
      llvm_key: ${{ steps.keys.outputs.llvm_key }}
      zig_key: ${{ steps.keys.outputs.zig_key }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out zig-build
        run: bash .github/scripts/clone-zig-build.sh "${{ inputs.zig_build_ref || 'main' }}"

      - name: Compute keys
        id: keys
        working-directory: zig-build
        run: |
          # plain assignments so a missing/failing script fails the step
          COMMIT=$(git rev-parse HEAD)
          HOST_KEY=$(bash ./cross-manifest.sh key host)
          LLVM_KEY=$(bash ./cross-manifest.sh key llvm "$TARGET" "$CPU")
          ZIG_KEY=$(bash ./cross-manifest.sh key zig "$TARGET" "$CPU")
          [ -n "$HOST_KEY" ] && [ -n "$LLVM_KEY" ] && [ -n "$ZIG_KEY" ] || { echo "::error::empty key"; exit 1; }
          {
            echo "zig_build_commit=$COMMIT"
            echo "host_key=$HOST_KEY"
            echo "llvm_key=$LLVM_KEY"
            echo "zig_key=$ZIG_KEY"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Skip if this zig_key is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ZIG_KEY: ${{ steps.keys.outputs.zig_key }}
        run: |
          FOUND=""
          for TAG in $(gh release list -R "$GITHUB_REPOSITORY" -L 100 --json tagName -q '.[].tagName | select(startswith(env.TARGET + "-"))'); do
            KEY=$(gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "zig+llvm+lld+clang-$TARGET-*.json" -O - 2>/dev/null \
              | jq -r '.zig_key // empty' || true)
            if [ -n "$KEY" ] && [ "$KEY" = "$ZIG_KEY" ]; then FOUND=$TAG; break; fi
          done
          if [ -n "$FOUND" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::notice::zig_key unchanged; already released as $FOUND"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  host:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          zig_build_commit: ${{ needs.prepare.outputs.zig_build_commit }}

      - name: Restore stage3
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: zig-build/bin/stage3
          key: stage3-${{ needs.prepare.outputs.host_key }}

      - name: Build stage3
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: zig-build
        run: bash ./build-stage3.sh

      - name: Save stage3
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: zig-build/bin/stage3
          key: stage3-${{ needs.prepare.outputs.host_key }}

      # build-zig-cross.sh stamps the cross Zig with stage3's version
      - name: Zig version
        id: version
        run: echo "version=$(zig-build/bin/stage3/bin/zig version)" | tee -a "$GITHUB_OUTPUT"

      - name: Package stage3
        run: tar -cf stage3.tar -C zig-build/bin stage3

      - uses: actions/upload-artifact@v7
        with:
          name: stage3
          path: stage3.tar
          retention-days: 2

  llvm-1:
    needs: [prepare, host]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          zig_build_commit: ${{ needs.prepare.outputs.zig_build_commit }}

      - uses: actions/download-artifact@v8
        with:
          name: stage3
      - name: Unpack stage3
        run: mkdir -p zig-build/bin && tar -xf stage3.tar -C zig-build/bin

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-llvm-${{ needs.prepare.outputs.llvm_key }}-${{ github.run_id }}-1
          restore-keys: |
            ccache-llvm-${{ needs.prepare.outputs.llvm_key }}-

      - name: Build cross LLVM (stops after 5h20m to leave time to save ccache)
        id: build
        working-directory: zig-build
        run: |
          set +e
          CCACHE=ccache timeout 320m bash ./build-llvm-cross.sh "$TARGET" "$CPU"
          rc=$?
          set -e
          ccache -s
          case $rc in
            0) echo "done=true" >> "$GITHUB_OUTPUT";;
            124) echo "::notice::time limit reached; llvm-2 resumes from ccache"; echo "done=false" >> "$GITHUB_OUTPUT";;
            *) exit $rc;;
          esac

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-llvm-${{ needs.prepare.outputs.llvm_key }}-${{ github.run_id }}-1

      - name: Package install prefix
        if: steps.build.outputs.done == 'true'
        run: tar -cf llvm-prefix.tar -C zig-build/build/cross "$TARGET-$CPU"

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.done == 'true'
        with:
          name: llvm-prefix
          path: llvm-prefix.tar
          retention-days: 2

  llvm-2:
    needs: [prepare, llvm-1]
    if: needs.llvm-1.result == 'success' && needs.llvm-1.outputs.done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          zig_build_commit: ${{ needs.prepare.outputs.zig_build_commit }}

      - uses: actions/download-artifact@v8
        with:
          name: stage3
      - name: Unpack stage3
        run: mkdir -p zig-build/bin && tar -xf stage3.tar -C zig-build/bin

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-llvm-${{ needs.prepare.outputs.llvm_key }}-${{ github.run_id }}-1
          restore-keys: |
            ccache-llvm-${{ needs.prepare.outputs.llvm_key }}-

      - name: Finish cross LLVM
        working-directory: zig-build
        run: |
          CCACHE=ccache bash ./build-llvm-cross.sh "$TARGET" "$CPU"
          ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-llvm-${{ needs.prepare.outputs.llvm_key }}-${{ github.run_id }}-2

      - name: Package install prefix
        run: tar -cf llvm-prefix.tar -C zig-build/build/cross "$TARGET-$CPU"

      - uses: actions/upload-artifact@v7
        with:
          name: llvm-prefix
          path: llvm-prefix.tar
          retention-days: 2

  zig:
    needs: [prepare, host, llvm-1, llvm-2]
    if: >-
      always() &&
      needs.prepare.outputs.should_build == 'true' &&
      (needs.llvm-1.outputs.done == 'true' || needs.llvm-2.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DEVKIT: zig+llvm+lld+clang-x86_64-macos-none-${{ needs.host.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          zig_build_commit: ${{ needs.prepare.outputs.zig_build_commit }}

      - uses: actions/download-artifact@v8
        with:
          name: stage3
      - uses: actions/download-artifact@v8
        with:
          name: llvm-prefix
      - name: Unpack stage3 and the LLVM prefix
        run: |
          mkdir -p zig-build/bin zig-build/build/cross
          tar -xf stage3.tar -C zig-build/bin
          tar -xf llvm-prefix.tar -C zig-build/build/cross

      - name: Build cross Zig
        working-directory: zig-build
        run: bash ./build-zig-cross.sh "$TARGET" "$CPU"

      # upstream's layout: the LLVM prefix, plus bin/zig and lib/zig
      - name: Assemble the devkit
        run: |
          cross=zig-build/build/cross
          cp -a "$cross/$TARGET-$CPU" "$DEVKIT"
          mkdir -p "$DEVKIT/bin"
          cp "$cross/zig-$TARGET-$CPU/zig" "$DEVKIT/bin/zig"
          cp -a "$cross/zig-$TARGET-$CPU/lib" "$DEVKIT/lib/zig"
          (cd zig-build && bash ./cross-manifest.sh json "$TARGET" "$CPU") > "$DEVKIT.json"
          cat "$DEVKIT.json"
          tar -cf - "$DEVKIT" | xz -T0 -9 > "$DEVKIT.tar.xz"
          ls -l "$DEVKIT.tar.xz"

      - uses: actions/upload-artifact@v7
        with:
          name: devkit
          path: |
            ${{ env.DEVKIT }}.tar.xz
            ${{ env.DEVKIT }}.json
          retention-days: 2

  smoke:
    needs: [host, zig]
    if: always() && needs.zig.result == 'success'
    runs-on: macos-15-intel
    env:
      DEVKIT: zig+llvm+lld+clang-x86_64-macos-none-${{ needs.host.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: devkit

      # the Zig runs, finds its lib/zig, and its LLVM backend, clang and lld work
      - name: Smoke test
        run: |
          tar -xJf "$DEVKIT.tar.xz"
          zig="$PWD/$DEVKIT/bin/zig"
          "$zig" version
          [ -f "$DEVKIT/lib/cmake/llvm/LLVMConfig.cmake" ] || { echo "::error::no LLVM prefix in the devkit"; exit 1; }
          cd "$RUNNER_TEMP"
          printf 'pub fn main() void {}\n' > hello.zig
          "$zig" build-exe hello.zig && ./hello
          printf '#include <stdio.h>\nint main(void) { puts("hello from zig cc"); return 0; }\n' > hello.c
          "$zig" cc hello.c -o hello-c && ./hello-c

  publish:
    needs: [prepare, host, zig, smoke]
    if: always() && needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.host.outputs.version }}
      DEVKIT: zig+llvm+lld+clang-x86_64-macos-none-${{ needs.host.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: devkit

      # immutable: the release is created with every asset, never added to
      - name: Publish
        id: publish
        run: |
          sum=$(sha256sum "$DEVKIT.tar.xz" | cut -d' ' -f1)
          echo "$sum  $DEVKIT.tar.xz" > SHA256SUMS
          base="$TARGET-$VERSION"
          tag=$base
          # a name taken by an earlier build (or reserved by a deleted
          # immutable release, which GitHub lists nowhere) takes the next suffix
          for n in $(seq 2 21); do
            if gh release create "$tag" -R "$GITHUB_REPOSITORY" --latest=false \
                --title "$TARGET devkit $VERSION" \
                --notes "The devkit for \`$TARGET\`, Zig \`$VERSION\`, built from zig-build's cross scripts; \`$DEVKIT.json\` lists every input. Upstream Zig publishes none for this host. \`devkits.json\` on main says which devkit each host should use." \
                "$DEVKIT.tar.xz" "$DEVKIT.json" SHA256SUMS 2> err.txt; then
              echo "Published $tag"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "sum=$sum" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat err.txt
            grep -qiE 'immutable release|already exists|already_exists' err.txt || exit 1
            tag="$base.$n"
          done
          echo "::error::no free release tag found"
          exit 1

      - name: Point devkits.json at it
        env:
          TAG: ${{ steps.publish.outputs.tag }}
          SUM: ${{ steps.publish.outputs.sum }}
        # never two closing braces in a row anywhere in this file: GitHub reads
        # them as template syntax and rejects the whole workflow, saying only
        # "Internal server error" (actionlint does not catch it)
        run: |
          jq -n --arg t "$TARGET" --arg v "$VERSION" --arg tag "$TAG" --arg a "$DEVKIT.tar.xz" --arg m "$DEVKIT.json" --arg s "$SUM" --arg repo "$GITHUB_REPOSITORY" \
            '{version: $v, source: "built", release: $tag, asset: $a, sha256: $s, manifest: $m,
              url: "https://github.com/\($repo)/releases/download/\($tag | @uri)/\($a | @uri)"} as $e
             | {($t): $e}' \
            | bash .github/scripts/update-manifest.sh "devkits.json: $TARGET $VERSION"
